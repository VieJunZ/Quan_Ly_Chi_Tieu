version: '3.8'

services:
  # 1. Dịch vụ Cơ sở dữ liệu
  database:
    image: mysql:8.0
    container_name: qlct_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: quan_ly_chi_tieu_db
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql

  # 2. Dịch vụ Backend
  backend:
    build: 
      context: ./backend
    container_name: qlct_backend
    ports:
      - "8080:8080"
    environment:
      - DB_HOST=database
      - DB_PORT=3306
      - DB_USER=root
      - DB_PASS=root
      - DB_NAME=quan_ly_chi_tieu_db
    depends_on:
      - database

  # 3. Dịch vụ Frontend
  frontend:
    build:
      context: ./frontend
    container_name: qlct_frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend

# Khai báo volume để dữ liệu DB không bị mất khi tắt máy
volumes:
  db_data: