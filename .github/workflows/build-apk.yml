name: Build Android APK with Native Widgets

on:
  push:
    branches:
      - "**"
  workflow_dispatch:

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.2"

      - name: Accept Android Licenses
        run: |
          yes | sdkmanager --licenses || true

      - name: Build APK with Widgets
        run: |
          cd android
          gradle assembleDebug --stacktrace
          mkdir -p ../output
          find . -name "*.apk" -exec cp {} ../output/thuchii.apk \;
          ls -la ../output

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: thuchii
          path: output/thuchii.apk
          retention-days: 30
