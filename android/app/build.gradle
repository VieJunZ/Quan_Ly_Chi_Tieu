plugins {
    id 'com.android.application'
}

android {
    namespace 'com.onrender.quan_ly_chi_tieu_k5kn.twa'
    compileSdk 34

    defaultConfig {
        applicationId "com.onrender.quan_ly_chi_tieu_k5kn.twa"
        minSdk 21
        targetSdk 34
        versionCode 2
        versionName "2.0.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            applicationIdSuffix ".debug"
            debuggable true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    sourceSets {
        main {
            java {
                // Loại trừ file R.java giả lập trong mã nguồn (để AAPT2 tự tạo R.java thật không bị trùng lặp)
                exclude '**/R.java'
            }
        }
    }

    applicationVariants.all { variant ->
        variant.outputs.all {
            outputFileName = "thuchii.apk"
        }
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
}

